; On-air test of the spec 11 hybrid frame on the LILYGO LoRa32 v2.1 (433 MHz, SX1278): sends hybrid test frames from K6ATV-14 and prints what it hears.
; pio run -t upload ; read the serial port at 115200.
[env:lora32]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@^7.1.0
build_flags = -O2 -DHB_FAST -I../../../reference -I..
