; Relay pipeline benchmark for spec 11 (the real frame code in tools/hb) on the LILYGO LoRa32 v2.1 and the T-Deck.  pio run -e lora32 -t upload ; read the serial port at 115200.
[env:lora32]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
build_flags = -O2 -DHB_FAST -I../../../reference -I..

[env:tdeck]
platform = espressif32 @ 6.3.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -O2 -DHB_FAST -I../../../reference -I.. -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
