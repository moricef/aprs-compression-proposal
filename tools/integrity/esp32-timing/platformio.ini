; Timing of the LACF ending and check C on an ESP32 (LILYGO LoRa32 v2.1, ESP32-PICO-D4, 240 MHz).  pio run -t upload ; then read the serial port at 115200.
[env:lora32]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
build_flags = -O2 -I../../../reference

[env:lora32fast]
extends = env:lora32
build_flags = -O2 -I../../../reference -DUSE_FAST

[env:lora32prof]
extends = env:lora32fast
build_flags = -O2 -I../../../reference -DUSE_FAST -DFF_PROF

[env:lora32ram]
extends = env:lora32fast
build_flags = -O2 -I../../../reference -DUSE_FAST -DMODEL_RAM -DFF_PROF

[env:keysram]
extends = env:lora32fast
build_flags = -O2 -I../../../reference -DUSE_FAST -DMODEL_RAM_KEYS

[env:keysram_recip]
extends = env:lora32fast
build_flags = -O2 -I../../../reference -DUSE_FAST -DMODEL_RAM_KEYS -DFF_RECIP

; the LILYGO T-Deck (ESP32-S3, 16 MB flash), same platform version and USB settings as moricef's tracker firmware
[env:tdeck_ref]
platform = espressif32 @ 6.3.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -O2 -I../../../reference -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:tdeck_fast]
extends = env:tdeck_ref
build_flags = -O2 -I../../../reference -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DUSE_FAST

[env:tdeck_keysram]
extends = env:tdeck_ref
build_flags = -O2 -I../../../reference -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DUSE_FAST -DMODEL_RAM_KEYS

; hybrid B tables (spec 11): hb_<board>_<info|comment>_<fast|keysram>

[env:hb_lora32_info_fast]
extends = env:lora32
build_flags = -O2 -I../../../reference -DUSE_FAST -DHB_INFO

[env:hb_lora32_info_keysram]
extends = env:lora32
build_flags = -O2 -I../../../reference -DUSE_FAST -DMODEL_RAM_KEYS -DHB_INFO

[env:hb_lora32_comment_fast]
extends = env:lora32
build_flags = -O2 -I../../../reference -DUSE_FAST -DHB_COMMENT

[env:hb_lora32_comment_keysram]
extends = env:lora32
build_flags = -O2 -I../../../reference -DUSE_FAST -DMODEL_RAM_KEYS -DHB_COMMENT

[env:hb_tdeck_info_fast]
extends = env:tdeck_ref
build_flags = -O2 -I../../../reference -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DUSE_FAST -DHB_INFO

[env:hb_tdeck_info_keysram]
extends = env:tdeck_ref
build_flags = -O2 -I../../../reference -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DUSE_FAST -DMODEL_RAM_KEYS -DHB_INFO

[env:hb_tdeck_comment_fast]
extends = env:tdeck_ref
build_flags = -O2 -I../../../reference -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DUSE_FAST -DHB_COMMENT

[env:hb_tdeck_comment_keysram]
extends = env:tdeck_ref
build_flags = -O2 -I../../../reference -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DUSE_FAST -DMODEL_RAM_KEYS -DHB_COMMENT
