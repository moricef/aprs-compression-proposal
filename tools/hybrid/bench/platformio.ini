; One firmware per layout: libs/<env>/AprsCompress holds the iGate firmware's codec with that layout's table (make_bench_libs.sh).
[env]
platform = espressif32 @ 6.12.0
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps = AprsCompress

[env:whole]
lib_extra_dirs = libs/whole
build_flags = -DFORM_WHOLE

[env:nopath]
lib_extra_dirs = libs/nopath
build_flags = -DFORM_NOPATH

[env:info]
lib_extra_dirs = libs/info
build_flags = -DFORM_INFO
